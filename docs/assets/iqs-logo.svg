<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="澄矩 · ChengJu (IQS)">
  <!--
    IQS horizontal lockup
    Left: product mark | Right: wordmark + lab credit
  -->
  <defs>
    <linearGradient id="logo-bg" x1="8" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
    <linearGradient id="logo-stream" x1="20" y1="68" x2="80" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- mark tile -->
  <g transform="translate(0 4)">
    <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#logo-bg)"/>
    <circle cx="30" cy="28" r="22" fill="#ffffff" opacity="0.06"/>
    <rect x="20" y="26" width="56" height="38" rx="6" fill="#F5F7FA" opacity="0.96"/>
    <line x1="26" y1="34" x2="70" y2="34" stroke="#0D5E42" stroke-opacity="0.18" stroke-width="1.4" stroke-dasharray="3 2.5"/>
    <line x1="26" y1="45" x2="70" y2="45" stroke="#0D5E42" stroke-opacity="0.28" stroke-width="1.4"/>
    <line x1="26" y1="56" x2="70" y2="56" stroke="#0D5E42" stroke-opacity="0.18" stroke-width="1.4" stroke-dasharray="3 2.5"/>
    <polyline points="26,48 34,42 42,46 50,36 58,44 66,40 72,46" fill="none" stroke="#0D5E42" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="42" r="2.2" fill="#0D5E42"/>
    <circle cx="50" cy="36" r="2.6" fill="#00D2FF"/>
    <circle cx="66" cy="40" r="2.2" fill="#0D5E42"/>
    <path d="M18 78 C30 73, 40 82, 50 78 C60 74, 70 77, 80 74" fill="none" stroke="url(#logo-stream)" stroke-width="3.5" stroke-linecap="round"/>
    <g transform="translate(72 22) scale(1.15)">
      <path d="M0-6 L1.4-1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4-1.4 Z" fill="#00D2FF"/>
      <circle cx="0" cy="0" r="1.4" fill="#F5F7FA"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="112" y="42" fill="#0D5E42" font-family="system-ui,-apple-system,PingFang SC,Segoe UI,sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em">澄矩 · ChengJu</text>
  <text x="112" y="68" fill="#0D5E42" opacity="0.55" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" letter-spacing="0.12em">IQS · Intelligent QC Studio</text>
  <text x="112" y="86" fill="#0D5E42" opacity="0.4" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="11">源清流澈，行止应矩 · 鹿溪联合创新实验室</text>
</svg>
