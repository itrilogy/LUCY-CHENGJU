<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-label="Intelligent QC Studio — LUXI Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D5E42"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="tile" x1="40" y1="36" x2="140" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
    <linearGradient id="stream" x1="48" y1="148" x2="148" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- banner field -->
  <rect width="960" height="200" rx="24" fill="url(#bg)"/>
  <circle cx="820" cy="40" r="90" fill="#ffffff" opacity="0.04"/>
  <circle cx="100" cy="180" r="70" fill="#00D2FF" opacity="0.06"/>

  <!-- IQS mark tile -->
  <g transform="translate(36 36)">
    <rect width="128" height="128" rx="28" fill="url(#tile)" stroke="#F5F7FA" stroke-opacity="0.15"/>
    <rect x="22" y="32" width="84" height="58" rx="8" fill="#F5F7FA" opacity="0.96"/>
    <line x1="32" y1="46" x2="96" y2="46" stroke="#0D5E42" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="32" y1="61" x2="96" y2="61" stroke="#0D5E42" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="32" y1="76" x2="96" y2="76" stroke="#0D5E42" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 3"/>
    <polyline points="32,66 44,54 56,62 70,48 84,58 96,52" fill="none" stroke="#0D5E42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44" cy="54" r="3.2" fill="#0D5E42"/>
    <circle cx="70" cy="48" r="3.6" fill="#00D2FF"/>
    <circle cx="96" cy="52" r="3.2" fill="#0D5E42"/>
    <path d="M20 112 C40 104, 56 118, 74 110 C90 103, 106 110, 120 104" fill="none" stroke="url(#stream)" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(102 28)">
      <path d="M0-8 L1.8-1.8 L8 0 L1.8 1.8 L0 8 L-1.8 1.8 L-8 0 L-1.8-1.8 Z" fill="#00D2FF"/>
      <circle cx="0" cy="0" r="1.8" fill="#F5F7FA"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="196" y="88" fill="#F5F7FA" font-family="system-ui,-apple-system,PingFang SC,Segoe UI,sans-serif" font-size="42" font-weight="800" letter-spacing="-0.03em">Intelligent QC Studio</text>
  <text x="196" y="122" fill="#A5F3FC" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" letter-spacing="0.22em">IQS · DSL v1 · MCP · ILDR</text>
  <text x="196" y="152" fill="#F5F7FA" opacity="0.75" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="15">智能质量控制工作站 · 林深见鹿，源启清溪</text>

  <!-- right lab badge -->
  <g transform="translate(760 48)">
    <rect width="160" height="104" rx="16" fill="#F5F7FA" opacity="0.95"/>
    <text x="80" y="40" text-anchor="middle" fill="#0D5E42" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">出品方</text>
    <text x="80" y="66" text-anchor="middle" fill="#0D5E42" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="15" font-weight="800">鹿溪联合创新实验室</text>
    <text x="80" y="88" text-anchor="middle" fill="#0D5E42" opacity="0.55" font-family="system-ui,-apple-system,sans-serif" font-size="11" letter-spacing="0.12em">LUXI LAB</text>
  </g>
</svg>
