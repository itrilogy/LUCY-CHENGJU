name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flow-check:
    name: IQS-Flow 校验 + 断言 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 卡片单一真源（SSOT）产物新鲜度与门禁校验
        run: npm run check:cards-fresh && npm run validate:cards

      - name: MCP 共享内核打包 + 新鲜度校验
        run: npm run build:mcp-lint && npm run check:mcp-lint-fresh

      - name: 鱼骨图几何不变量（G1–G7）
        run: npm run test:fishbone

      - name: IQS-Flow 断言（parser + svg + bpmn + geometry）
        run: npm run test:flow

      - name: 构建（validate:dsl + test:flow + build:mcp-lint + vite）
        run: npm run build
