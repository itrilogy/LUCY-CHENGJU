<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="澄矩 · ChengJu (IQS)">
  <!--
    澄矩 · ChengJu (IQS) 横版字锁
    左：产品方标（.brick 范式，与 /brand/iqs-mark.svg 同构）
    右：中文字名 + 英文副标 + 实验室署名
    范式：LUXI Design System v1.0 · 中文优先字体栈 · 鹿溪绿 #0D5E42
  -->
  <defs>
    <linearGradient id="iqs-logo-stream" x1="16" y1="0" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- 产品方标：48 → 88（scale 1.8333，translate 8 12） -->
  <g transform="translate(8 12) scale(1.8333)">
    <!-- .brick -->
    <rect width="48" height="48" rx="12" fill="#0D5E42"/>
    <!-- 业务图形：控制限 + 正交走线 -->
    <g transform="translate(11 11) scale(1.0833)">
      <path d="M4 10h16M10 4v16" fill="none" stroke="#F5F7FA" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- .stream -->
    <rect x="8" y="39" width="32" height="3" rx="1.5" fill="url(#iqs-logo-stream)"/>
    <!-- .star -->
    <path transform="translate(38 5)" fill="#F1C40F"
          d="M2.5 0 L3.05 1.75 L5 1.75 L3.4 2.85 L3.95 4.55 L2.5 3.5 L1.05 4.55 L1.6 2.85 L0 1.75 L1.95 1.75 Z"/>
  </g>

  <!-- 字名（中文优先） -->
  <text x="112" y="42" fill="#0D5E42"
        font-family="PingFang SC, HarmonyOS Sans SC, Microsoft YaHei, Noto Sans SC, system-ui, sans-serif"
        font-size="28" font-weight="700" letter-spacing="-0.02em">澄矩 · ChengJu</text>
  <text x="112" y="68" fill="#0D5E42" opacity="0.55"
        font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace"
        font-size="13" font-weight="600" letter-spacing="0.06em">IQS · Intelligent QC Studio</text>
  <text x="112" y="86" fill="#0D5E42" opacity="0.4"
        font-family="PingFang SC, HarmonyOS Sans SC, Microsoft YaHei, system-ui, sans-serif"
        font-size="11">源清流澈，行止应矩 · 鹿溪联合创新实验室</text>
</svg>
