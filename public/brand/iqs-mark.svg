<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="澄矩 · ChengJu (IQS)">
  <!--
    澄矩 · ChengJu (IQS) 产品方标
    范式：LUXI Design System v1.0（LUCY-DESIGN）· 工坊·一法
    结构（与 Sample/luxi-scenario-kit-final.html §VI 完全同构）：
      48×48 鹿溪绿圆角砖(rx=12) + 24 视口单色业务图形(stroke 1.7)
      + 底部水平溪流(.stream) + 右上角金色五角星(.star)
    业务图形 glyph：控制限 + 正交走线（水平线 × 垂直线）
    色：鹿溪绿 #0D5E42 · 源启白 #F5F7FA · 进化蓝 #00D2FF · 标题金 #F1C40F
  -->
  <defs>
    <linearGradient id="iqs-stream" x1="8" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- .brick —— 鹿溪绿圆角砖（纯色；范式禁渐变底） -->
  <rect width="48" height="48" rx="12" fill="#0D5E42"/>

  <!-- 业务图形：24 视口 glyph → 26px 居中（scale 26/24，translate 11） -->
  <g transform="translate(11 11) scale(1.0833)">
    <path d="M4 10h16M10 4v16"
          fill="none" stroke="#F5F7FA" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- .stream —— 底部水平溪流 -->
  <rect x="8" y="39" width="32" height="3" rx="1.5" fill="url(#iqs-stream)"/>

  <!-- .star —— 右上角金色五角星 -->
  <path transform="translate(38 5)"
        fill="#F1C40F"
        d="M2.5 0 L3.05 1.75 L5 1.75 L3.4 2.85 L3.95 4.55 L2.5 3.5 L1.05 4.55 L1.6 2.85 L0 1.75 L1.95 1.75 Z"/>
</svg>
