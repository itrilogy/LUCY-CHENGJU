services:
  smart-qc-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-qc-studio:latest
    container_name: smart-qc-studio
    ports:
      - "12000:12000"
      - "12001:12001"
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY}
      - AI_ACTIVE_PROFILE=${AI_ACTIVE_PROFILE:-deepseek_public}
      - IQS_BASE_URL=http://localhost:12000
      - WEB_PORT=12000
      - PORT=12001
    restart: unless-stopped
    networks:
      - qc-network

networks:
  qc-network:
    driver: bridge
